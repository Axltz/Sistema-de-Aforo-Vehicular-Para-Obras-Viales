name: CI

# Run on every push to main and on every pull request targeting main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint and unit tests
    runs-on: ubuntu-latest

    steps:
      # 1) Bring the repository into the runner's workspace.
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Install Python 3.11 and enable pip download caching.
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # 3) Native libraries that OpenCV/YOLO need on Linux.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libgomp1

      # 4) Install runtime + development dependencies (flake8 and pytest).
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # 5) Lint with flake8.
      #    First pass: fail on real errors (E9 syntax, F82/F7/F63 undefined names).
      #    Second pass: style report only, never fails the build (--exit-zero).
      - name: Lint with flake8
        run: |
          flake8 src --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      # 6) Run the unit test suite with pytest.
      - name: Run unit tests
        run: pytest -q
